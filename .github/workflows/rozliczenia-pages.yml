# Katalog główny repozytorium = pakiet rozliczenia.
#
# Sekrety:
#   CLOUDFLARE_API_TOKEN — token z uprawnieniem Cloudflare Pages Edit
#   CLOUDFLARE_ACCOUNT_ID — Account ID z dash.cloudflare.com
#   CLOUDFLARE_PAGES_PROJECT — nazwa projektu Pages (np. rozliczenia-6yo)
#
# Build używa same-origin /api/transport (cookie Pages).
# Na CF Pages env: CFP_PASSWORD + GAS_PROXY_BASE=https://….workers.dev
#
# Generate w GH Actions → wrangler pages deploy → *.pages.dev
# github.io: tylko stub (bez API).
#
# W CF Pages: wyłącz automatyczny build z Gita (Settings → Builds), żeby nie dublować.
name: rozliczenia — Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: rozliczenia-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Skrypt mapy do testów kontraktu
        run: git clone --depth 1 https://github.com/Zotrek/arkusz-mapa.git "${GITHUB_WORKSPACE}/../arkusz-mapa"

      - name: Testy
        run: npm test

      - name: Złóż stronę z adresem Web App
        run: |
          export TRANSPORT_WEBAPP_URL="/api/transport"
          npm run build
          mkdir -p site
          cp index.html logo.png jednorozec-deba.gif site/

      - name: Publikacja na Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Brak CLOUDFLARE_API_TOKEN lub CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          PROJECT="${{ secrets.CLOUDFLARE_PAGES_PROJECT }}"
          if [ -z "$PROJECT" ]; then
            echo "::error::Brak CLOUDFLARE_PAGES_PROJECT (nazwa projektu w CF, np. rozliczenia-6yo)"
            exit 1
          fi
          npx --yes wrangler@4 pages deploy ./site --project-name="$PROJECT" --commit-dirty=true

      - name: Stub na gh-pages (bez API)
        run: |
          mkdir -p gh-stub
          cat > gh-stub/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pl">
          <head><meta charset="utf-8"><title>Rozliczenia przeniesione</title></head>
          <body style="font-family:system-ui;max-width:36rem;margin:3rem auto;padding:0 1rem">
            <h1>Aplikacja jest na Cloudflare Pages</h1>
            <p>Użyj linku <strong>*.pages.dev</strong> (po haśle zespołu).</p>
          </body>
          </html>
          EOF

      - name: Publikacja stubu na gałąź gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-stub
          force_orphan: true
          commit_message: "deploy: rozliczenia gh-stub ${{ github.run_id }}"
