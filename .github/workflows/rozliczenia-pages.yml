# Katalog główny repozytorium = pakiet rozliczenia.
#
# Sekrety:
#   TRANSPORT_WEBAPP_URL — URL Cloudflare Workera …/api/transport
#   CLOUDFLARE_API_TOKEN — token z uprawnieniem Cloudflare Pages Edit
#   CLOUDFLARE_ACCOUNT_ID — Account ID z dash.cloudflare.com
#   CLOUDFLARE_PAGES_PROJECT — nazwa projektu Pages (np. rozliczenia-6yo)
#
# Generate w GH Actions → wrangler pages deploy → *.pages.dev (hasło: CFP_PASSWORD w CF).
# Opcjonalnie nadal push na gh-pages (stary github.io).
#
# W CF Pages: wyłącz automatyczny build z Gita (Settings → Builds), żeby nie dublować.
name: rozliczenia — Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: rozliczenia-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Skrypt mapy do testów kontraktu
        run: git clone --depth 1 https://github.com/Zotrek/arkusz-mapa.git "${GITHUB_WORKSPACE}/../arkusz-mapa"

      - name: Testy
        run: npm test

      - name: Złóż stronę z adresem Web App
        env:
          TRANSPORT_WEBAPP_URL: ${{ secrets.TRANSPORT_WEBAPP_URL }}
        run: |
          if [ -z "$TRANSPORT_WEBAPP_URL" ]; then
            echo "::error::Brak sekretu TRANSPORT_WEBAPP_URL"
            exit 1
          fi
          npm run build
          mkdir -p site
          cp index.html logo.png jednorozec-deba.gif site/

      - name: Publikacja na Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Brak CLOUDFLARE_API_TOKEN lub CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          PROJECT="${{ secrets.CLOUDFLARE_PAGES_PROJECT }}"
          if [ -z "$PROJECT" ]; then
            echo "::error::Brak CLOUDFLARE_PAGES_PROJECT (nazwa projektu w CF, np. rozliczenia-6yo)"
            exit 1
          fi
          npx --yes wrangler@4 pages deploy ./site --project-name="$PROJECT" --commit-dirty=true

      - name: Publikacja na gałąź gh-pages (legacy github.io)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: "deploy: rozliczenia ${{ github.run_id }}"
