<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rozliczenia</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
:root {
  --bg: #e7eeee;
  --ink: #0f172a;
  --muted: #64748b;
  --line: rgba(148, 163, 184, 0.45);
  --teal: #0d9488;
  --teal-deep: #0f766e;
  --teal-soft: rgba(13, 148, 136, 0.12);
  --shadow: 0 10px 30px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(15, 23, 42, 0.06);
  --font: system-ui, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body, #app { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
}
#app { position: relative; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 36px; height: 36px; border-radius: 8px; }
.brand strong { display: block; font-size: 15px; }
.brand em { display: block; font-style: normal; font-size: 12px; color: var(--muted); font-weight: 600; }
.modes {
  display: flex;
  width: 100%;
  margin: 16px 0 4px;
  padding: 3px;
  border-radius: 10px;
  background: rgba(148, 163, 184, 0.16);
  border: 1px solid rgba(148, 163, 184, 0.25);
}
.mode {
  position: relative;
  flex: 1;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  color: #475569;
  text-align: center;
}
.mode input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.mode.is-on { background: var(--teal); color: #fff; }
.mode.is-off { color: #64748b; cursor: pointer; }
.mode.is-off:hover { color: var(--ink); }
.filters { display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
.field input, .field select {
  font-weight: 550;
  color: var(--ink);
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid rgba(148, 163, 184, 0.55);
  background: #fff;
  width: 100%;
  min-width: 0;
}
.field input[type="date"] { display: block; min-height: 38px; }
.field input:disabled { background: #f8fafc; color: #94a3b8; }
.field.is-error input { border-color: #e11d48; }
.err { color: #e11d48; font-weight: 650; font-size: 12px; line-height: 1.35; }
.btn-teal, .btn-ghost {
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 650;
}
.btn-teal { border: none; color: #fff; background: var(--teal); width: 100%; margin-top: 8px; }
.btn-teal:hover { background: var(--teal-deep); }
.setup .btn-teal { margin-top: 14px; }
.btn-ghost {
  border: 1px solid var(--line);
  background: #fff;
}
.note { margin: 8px 0 0; font-size: 12px; color: var(--muted); font-weight: 550; line-height: 1.4; }
.checkline { display: flex; align-items: center; gap: 8px; margin: 0; color: #334155; font-size: 13px; font-weight: 550; line-height: 1.3; }
.checkline input { width: 16px; height: 16px; margin: 0; accent-color: var(--teal); }
.callout {
  margin: 12px 0 0;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--teal-soft);
  border: 1px solid rgba(13, 148, 136, 0.28);
  color: var(--teal-deep);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.4;
}
.setup {
  height: 100%;
  overflow: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 28px 16px;
  background: #f4f7f6;
}
.setup-card {
  width: min(480px, 100%);
  margin-block: auto;
  flex-shrink: 0;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px 22px 16px;
  box-shadow: var(--shadow);
}
.setup-card h2 { margin: 16px 0 6px; font-size: 20px; letter-spacing: -0.02em; }
.setup-lead { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); font-weight: 550; }
.dates {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 12px;
  align-items: start;
}
.dates .checkline { grid-column: 1 / -1; }
.setup-foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.setup-foot .btn-ghost { flex: 1 1 auto; min-width: 7.5rem; }
@media (max-width: 520px) {
  .dates { grid-template-columns: 1fr; }
}
.field.picker { position: relative; z-index: 4; }
.field.picker:focus-within { z-index: 6; }
.picker-wrap { position: relative; }
.picker-wrap [data-picker-list] {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 2px);
  z-index: 5;
}
.picker-wrap [data-rate-list] {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 2px);
  z-index: 5;
}
.picker-list {
  list-style: none;
  margin: 0;
  padding: 4px;
  max-height: 220px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  box-shadow: var(--shadow);
}
.picker-list button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 100%;
  padding: 8px 10px;
  border: none;
  border-radius: 8px;
  background: transparent;
  text-align: left;
  font-weight: 700;
  font-size: 13px;
}
.picker-list button:hover,
.picker-list button.is-active { background: var(--teal-soft); color: var(--teal-deep); }
.picker-empty { margin: 4px 0 0; }
.statement {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #fff;
}
.top {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
}
.range { display: flex; flex-direction: column; gap: 2px; min-width: 0; margin-right: auto; }
.range span { font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.range strong { font-size: 14px; font-weight: 700; }
.blank { padding: 48px 24px; color: var(--muted); text-align: center; }
.blank strong { display: block; color: var(--ink); margin-bottom: 6px; }
.overlay, .modal {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.overlay { background: rgba(244, 247, 246, 0.72); z-index: 5; }
.modal { background: rgba(15, 23, 42, 0.35); z-index: 4; }
.overlay-panel, .modal-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 18px 22px;
  background: rgba(255, 255, 255, 0.96);
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.7);
  box-shadow: var(--shadow);
  text-align: center;
}
.overlay-panel img.pulse {
  width: 64px;
  height: 64px;
  border-radius: 12px;
  animation: logo-pulse 1.2s ease-in-out infinite;
}
@keyframes logo-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.12); opacity: 0.55; }
}
.overlay-panel .msg { font-size: 13px; font-weight: 700; color: var(--muted); }
.modal-panel {
  width: min(440px, calc(100% - 32px));
  align-items: stretch;
  text-align: left;
  gap: 8px;
}
.modal-panel h2 { margin: 0; font-size: 16px; }
.rates-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 0 0 12px;
}
.rates-tab {
  border: 1px solid #cbd5e1;
  background: #f8fafc;
  color: #64748b;
  border-radius: 8px;
  padding: 6px 10px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.rates-tab.is-on {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.modal-actions .btn-ghost, .modal-actions .btn-teal { width: auto; margin-top: 0; }
:root { --orange: #ea580c; --orange-deep: #c2410c; --rose: #e11d48; }
.center-h { padding: 12px 14px 0; font-size: 13px; color: var(--muted); font-weight: 650; }
.table-wrap { flex: 1; min-height: 0; overflow: auto; }
table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; background: #fff; }
th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #f8fafc;
  font-size: 11px;
  letter-spacing: 0.02em;
  text-align: left;
  color: var(--muted);
}
th.num, td.num { text-align: right; }
th.c, td.c { text-align: center; }
tr.is-route td { background: #f0fdfa; }
tr.is-child td { background: #f8fafc; }
tr.is-checked td { background: rgba(13, 148, 136, 0.08); }
tr.is-route.is-checked td { background: #d1fae5; }
tr.is-dead { color: #94a3b8; }
.strike { text-decoration: line-through; }
.who-line { display: flex; align-items: flex-start; gap: 4px; }
td.adres { font-weight: 700; }
td.sklep { font-weight: 450; white-space: normal; }
.sub { color: var(--muted); font-weight: 550; font-size: 12px; }
.only, .trip { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: #334155; font-size: 12px; font-weight: 550; }
.trip-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.btn-detach, .btn-mini {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  padding: 3px 8px;
  font-size: 12px;
  font-weight: 650;
  color: var(--teal-deep);
}
.btn-detach:hover, .btn-mini:hover { background: var(--teal-soft); }
.new-route { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 6px; max-width: 280px; }
.new-route .sub { flex-basis: 100%; }
td .new-route input[type="text"] { width: 9.5rem; text-align: left; font-size: 12px; }
td .new-route input[data-draft="route-rate"] { width: 4.8rem; text-align: right; }
.new-route .err { flex-basis: 100%; }
tr.is-child td.adres { box-shadow: inset 3px 0 0 var(--teal); }
td input[type="text"] {
  width: 76px;
  padding: 4px 6px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.8);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
td input[data-edit="bags"] { width: 56px; }
td input[type="text"]:hover { border-color: var(--line); }
td input[type="text"]:focus { border-color: var(--teal); background: #fff; outline: none; }
.tag {
  display: inline-block;
  margin-right: 6px;
  padding: 2px 6px;
  border-radius: 999px;
  background: var(--teal-soft);
  color: var(--teal-deep);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.tag-route { background: #ffedd5; color: #9a3412; }
.chev { border: none; background: transparent; color: var(--teal-deep); font-size: 14px; padding: 0 2px; }
.money, .stat b { font-variant-numeric: tabular-nums; }
.footer {
  display: flex;
  align-items: flex-end;
  gap: 22px;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  background: #fff;
}
.stat span {
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}
.stat b { font-size: 20px; }
.stat.sel b { color: var(--teal-deep); }
.grow { margin-left: auto; display: flex; gap: 8px; align-items: flex-end; }
.invoice { width: 210px; font-weight: 550; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(148, 163, 184, 0.55); }
.btn-go { border: none; color: #fff; background: var(--orange); border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 650; }
.btn-go:hover:not(:disabled) { background: var(--orange-deep); }
.btn-go:disabled { opacity: 0.45; }
.tie { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-top: 6px; }
.overlay-panel img.uni { width: 220px; height: auto; }
.statement .top .btn-ghost, .statement .top .btn-teal { width: auto; margin-top: 0; }


/* —— Statystyki —— */
.stats {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  background: #fff;
}
.stats .top { flex-wrap: wrap; gap: 12px; }
.stats .top .brand { margin-right: auto; }
.stats .filters {
  flex-direction: row;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-end;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: #f8fafc;
}
.stats .filters .field input,
.stats .filters .field select { min-width: 9rem; width: auto; }
.stats .filters .btn-teal { width: auto; }
.period-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.chip {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 650;
  color: #334155;
}
.chip.is-on {
  background: var(--teal-soft);
  border-color: transparent;
  color: var(--teal-deep);
}
.exact-range { display: none; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.exact-range.is-on { display: flex; }
.month-pick,
.quarter-pick { display: none; }
.month-pick.is-on,
.quarter-pick.is-on { display: flex; }
.stats .body {
  flex: 1;
  overflow: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.period-label {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
  font-weight: 650;
}
.period-label strong { color: var(--ink); }
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
@media (max-width: 900px) {
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.kpi {
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
}
.kpi span {
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.kpi b {
  display: block;
  font-size: 22px;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.kpi em {
  display: block;
  margin-top: 4px;
  font-style: normal;
  font-size: 12px;
  color: var(--muted);
  font-weight: 550;
}
.kpi.warn b { color: var(--orange-deep); }
.kpi.ok b { color: var(--teal-deep); }
.section {
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: #fff;
}
.section-h {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  background: #f8fafc;
  cursor: pointer;
  user-select: none;
}
.section-h:hover { background: #f1f5f9; }
.section-h h2 { margin: 0; font-size: 14px; }
.section-h .head-text { flex: 1; min-width: 0; }
.section-h p {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--muted);
  font-weight: 550;
}
.section.is-collapsed .section-h { border-bottom: none; }
.section.is-collapsed .section-b { display: none; }
.fold-chev {
  flex: none;
  width: 28px;
  height: 28px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--teal-deep);
  font-size: 14px;
  font-weight: 700;
  line-height: 1;
}
.table-fold-bar {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
  padding: 8px 10px;
  border: 1px dashed var(--line);
  border-radius: 10px;
  background: #f8fafc;
}
.chart-split.is-stack .table-fold-bar { display: flex; }
.table-fold-bar button {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 650;
  color: var(--teal-deep);
}
.table-fold-bar .muted { font-size: 12px; color: var(--muted); font-weight: 550; }
.chart-split.is-stack .table-pane.is-collapsed { display: none; }
.chart-split:not(.is-stack) .table-fold-bar { display: none; }
.chart-split:not(.is-stack) .table-pane { display: block; }
.section-b { padding: 12px 14px; }
.bags-grid {
  display: grid;
  grid-template-columns: 180px 1fr 1fr;
  gap: 12px;
}
@media (max-width: 900px) {
  .bags-grid { grid-template-columns: 1fr; }
}
.rank-block { margin-bottom: 16px; }
.rank-block:last-child { margin-bottom: 0; }
.rank-block > .metric {
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 750;
  color: var(--ink);
}
.rank-block > .metric span {
  display: block;
  margin-top: 2px;
  font-size: 12px;
  font-weight: 550;
  color: var(--muted);
}
.rank-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 900px) {
  .rank-pair { grid-template-columns: 1fr; }
}
.avg-box {
  padding: 14px;
  border-radius: 12px;
  background: var(--teal-soft);
  text-align: center;
}
.avg-box span {
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--teal-deep);
}
.avg-box b {
  display: block;
  margin-top: 6px;
  font-size: 28px;
  font-variant-numeric: tabular-nums;
  color: var(--teal-deep);
}
.avg-box em {
  display: block;
  margin-top: 4px;
  font-style: normal;
  font-size: 12px;
  color: var(--muted);
}
.rank h3 {
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}
.rank.hi h3 { color: var(--orange-deep); }
.rank.lo h3 { color: var(--teal-deep); }
.stats td.shop { font-weight: 700; white-space: normal; }
.stats .sub { display: block; font-size: 12px; font-weight: 550; color: var(--muted); }
.tag-gap { background: #ffe4e6; color: var(--rose); }
.tag-tie { background: #fef3c7; color: #92400e; }
.money.hi { color: var(--orange-deep); }
.money.lo { color: var(--teal-deep); }
.bags-time-chart {
  display: flex;
  align-items: flex-end;
  justify-content: flex-start;
  gap: 6px;
  min-height: 140px;
  padding: 8px 4px 0;
  border-bottom: 1px solid var(--line);
  margin-bottom: 12px;
}
.bags-time-chart.is-dense {
  gap: 5px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.bags-time-chart.is-dense .bags-time-col { flex: 0 0 40px; }
.bags-time-chart.is-dense .bags-time-stack { max-width: 28px; height: 140px; }
.bags-time-chart.is-dense .wk {
  font-size: 10px;
  transform: rotate(-35deg);
  width: 3.2rem;
  margin-top: 6px;
  margin-bottom: 8px;
}
.bags-time-col {
  flex: 0 0 52px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.bags-time-stack {
  width: 100%;
  max-width: 36px;
  height: 120px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 2px;
}
.bags-time-stack i {
  display: block;
  width: 100%;
  border-radius: 4px 4px 2px 2px;
  min-height: 0;
}
.bags-time-stack .s-na { background: var(--teal); }
.bags-time-stack .s-h { background: var(--orange); }
.bags-time-col.is-incomplete .bags-time-stack {
  opacity: 0.48;
}
.bags-time-col.is-incomplete .bags-time-stack i {
  background-image: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 3px,
    rgba(255, 255, 255, 0.45) 3px,
    rgba(255, 255, 255, 0.45) 5px
  );
}
.bags-time-col.is-incomplete .wk {
  color: var(--teal-deep);
  font-style: italic;
}
.bags-time-col .wk {
  font-size: 11px;
  font-weight: 650;
  color: var(--muted);
  text-align: center;
  line-height: 1.2;

        `<span class="meta">${escapeHtml(meta)}</span>` +

function rateContractorHits(model) {
    const browsing = model.ratesContractorOpen &&
        model.ratesContractor !== "" &&
        foldPl(model.ratesContractorQuery) === foldPl(model.ratesContractor);
    const names = [];
    const seen = new Set();
    for (const item of matchingContractors(model.contractors, model.ratesContractorQuery, browsing)) {
        const name = item.nazwa.trim();
        if (name === "" || seen.has(name)) {
            continue;
        }
        seen.add(name);
        names.push(name);
        if (names.length >= CONTRACTOR_LIST_LIMIT) {
            break;
        }
    }
    return names;
}

    const start = current?.selectionStart ?? null;
    const end = current?.selectionEnd ?? null;

        const ref = sheetRef(el);
        if (!ref) {
            return;
        }
        const key = rowKey(ref.sheetRow, ref.transportNumber);
        const prev = VIEW.statement.routeDraft[key] ?? { name: "", rate: "" };
        const draft = el.dataset.draft === "route-name" ? { ...prev, name: el.value } : { ...prev, rate: el.value };
        const routeDraftError = { ...VIEW.statement.routeDraftError };
        delete routeDraftError[key];
        VIEW.statement = {
            ...VIEW.statement,
            routeDraft: { ...VIEW.statement.routeDraft, [key]: draft },
            routeDraftError,

        paint(el.dataset.keep);

    if (el.dataset.rate === "shop" || el.dataset.rate === "contractor") {
        typeRateField(el);

        if (el.dataset.rate === "pickup") {
            VIEW.ratesPickup = el.value;

        else if (el.dataset.rate === "bag") {
            VIEW.ratesBag = el.value;
        }
        else if (el.dataset.rate === "days") {
            VIEW.ratesDays = el.value;

        applyStatsField(el.dataset.stats, el.value);

        VIEW.statement =
            el.dataset.toggle === "bags-only"

                : setDidNotHappen(VIEW.statement, ref.sheetRow, ref.transportNumber, el.checked);

    if (el.dataset.edit === "bags" ||
        el.dataset.edit === "pickup" ||
        el.dataset.edit === "bag-rate" ||
        el.dataset.edit === "bag-rate-route" ||
        el.dataset.edit === "route-rate") {
        void commitEdit(el);

    if (el.id === "mode-h") {
        VIEW.mode = "schedule";

        const next = applyNoStartDate({ from: VIEW.from, held: heldFrom }, el.checked);

        heldFrom = next.held;
        VIEW.noFrom = el.checked;

function onFocusIn(event) {
    const el = event.target;
    if (!(el instanceof HTMLInputElement)) {
        return;
    }
    if (el.dataset.filter === "contractor") {
        VIEW.contractorOpen = true;
        syncContractorPicker();
        return;
    }
    if (el.dataset.rate !== "shop" && el.dataset.rate !== "contractor") {
        return;
    }
    if (el.dataset.rate === "shop") {
        VIEW.ratesShopOpen = true;
        VIEW.ratesContractorOpen = false;
    }
    else {
        VIEW.ratesContractorOpen = true;
        VIEW.ratesShopOpen = false;

function onFocusOut(event) {
    const el = event.target;
    if (!(el instanceof HTMLInputElement)) {
        return;
    }
    if (el.dataset.filter === "contractor") {
        window.setTimeout(() => {
            const still = document.activeElement;
            if (still instanceof HTMLInputElement && still.dataset.filter === "contractor") {
                return;
            }
            const resolved = resolveContractorText(VIEW.contractors, VIEW.contractorQuery);
            VIEW.contractor = resolved.contractor;
            VIEW.contractorQuery = resolved.query;
            VIEW.contractorOpen = false;
            const input = document.querySelector('[data-filter="contractor"]');
            if (input instanceof HTMLInputElement) {
                input.value = VIEW.contractorQuery;
            }
            syncContractorPicker();
        }, 150);
        return;
    }
    if (el.dataset.rate !== "shop" && el.dataset.rate !== "contractor") {
        return;
    }
    const field = el.dataset.rate === "shop" ? "shop" : "contractor";
    window.setTimeout(() => {
        const still = document.activeElement;
        if (still instanceof HTMLInputElement && still.dataset.rate === field) {
            return;
        }
        commitRateField(field);
        const input = document.querySelector(`[data-window="rates"] [data-rate="${field}"]`);
        if (input instanceof HTMLInputElement) {

function contractorOptions() {

function moveContractorActive(delta) {
    if (!VIEW.contractorOpen) {
        VIEW.contractorOpen = true;
        syncContractorPicker();
    }
    const items = contractorOptions();
    if (!items.length) {
        return;
    }
    const current = items.findIndex((item) => item.classList.contains("is-active"));
    const next = current < 0
        ? delta > 0
            ? 0
            : items.length - 1
        : Math.min(items.length - 1, Math.max(0, current + delta));
    for (let i = 0; i < items.length; i += 1) {
        items[i].classList.toggle("is-active", i === next);
    }
    items[next].scrollIntoView({ block: "nearest" });
}

}

    const next = current < 0
        ? delta > 0
            ? 0
            : items.length - 1
        : Math.min(items.length - 1, Math.max(0, current + delta));

function onKeyDown(event) {
    const el = event.target;
    if (!(el instanceof HTMLInputElement)) {
        return;
    }
    if (el.dataset.filter === "contractor") {
        if (event.key === "Escape") {
            VIEW.contractorOpen = false;
            syncContractorPicker();
            return;
        }
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            moveContractorActive(event.key === "ArrowDown" ? 1 : -1);
            return;
        }
        if (event.key === "Enter" && VIEW.contractorOpen) {
            const active = contractorOptions().find((item) => item.classList.contains("is-active"));
            const pick = active ?? contractorOptions()[0];
            if (!pick) {
                return;
            }
            event.preventDefault();
            pickContractor(pick.dataset.nazwa ?? "");
        }
        return;
    }
    if (el.dataset.rate !== "shop" && el.dataset.rate !== "contractor") {
        return;
    }
    const field = el.dataset.rate === "shop" ? "shop" : "contractor";
    const open = field === "shop" ? VIEW.ratesShopOpen : VIEW.ratesContractorOpen;
    if (event.key === "Escape") {
        if (field === "shop") {
            VIEW.ratesShopOpen = false;
        }
        else {
            VIEW.ratesContractorOpen = false;
        }
        syncRatePicker(field);
        return;
    }
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        moveRateActive(field, event.key === "ArrowDown" ? 1 : -1);
        return;
    }
    if (event.key === "Enter" && open) {
        const items = rateOptions(field);
        const active = items.find((item) => item.classList.contains("is-active"));
        const pick = active ?? items[0];
        if (!pick) {
            return;
        }
        event.preventDefault();
        pickRateValue(field, pick.dataset.value ?? "");
    }
}

    const note = document.querySelector("[data-contractor-note]");
    if (note instanceof HTMLElement) {
        const show = picked !== null && !VIEW.contractorOpen;
        note.hidden = !show;
        note.textContent = show && picked ? picked.dane : "";
    }
    const field = input.closest(".picker");
    if (field instanceof HTMLElement) {
        field.classList.toggle("is-error", VIEW.error === "contractor");
        if (VIEW.error !== "contractor") {
            field.querySelector("[data-contractor-error]")?.remove();
        }
    }
    if (!VIEW.contractorOpen) {
        box.hidden = true;
        box.innerHTML = "";
        return;
    }

    box.innerHTML = renderContractorList(VIEW);
}
function syncRatesMessage() {

    }
    el.hidden = VIEW.ratesMessage === "";
    el.textContent = VIEW.ratesMessage;
    el.className = VIEW.ratesMessageOk ? "note" : "err";
}
function syncRatePicker(field) {
    const input = document.querySelector(`[data-window="rates"] [data-rate="${field}"]`);
    const box = document.querySelector(`[data-rate-list="${field}"]`);
    if (!(input instanceof HTMLInputElement) || !(box instanceof HTMLElement)) {
        return;
    }
    const open = field === "shop" ? VIEW.ratesShopOpen : VIEW.ratesContractorOpen;
    input.setAttribute("aria-expanded", open ? "true" : "false");
    if (!open) {
        box.hidden = true;
        box.innerHTML = "";
        return;
    }
    box.hidden = false;
    box.innerHTML = field === "shop" ? renderRateShopList(VIEW) : renderRateContractorList(VIEW);
}
function onMouseDown(event) {
    const target = event.target;
    if (!(target instanceof Element)) {
        return;
    }
    const ratePick = target.closest("[data-action='pick-rate-shop'], [data-action='pick-rate-contractor']");
    if (ratePick instanceof HTMLElement) {
        event.preventDefault();
        const field = ratePick.dataset.action === "pick-rate-shop" ? "shop" : "contractor";
        pickRateValue(field, ratePick.dataset.value ?? "");
        return;
    }
    const pick = target.closest("[data-action='pick-contractor']");
    if (!(pick instanceof HTMLElement)) {
        return;
    }
    event.preventDefault();
    pickContractor(pick.dataset.nazwa ?? "");
}
function sheetRef(el) {
    const sheetRow = Number(el.dataset.sheetRow);
    const transportNumber = el.dataset.transport ?? "";
    if (!Number.isInteger(sheetRow) || sheetRow < 2 || transportNumber === "") {
        return null;
    }
    return { sheetRow, transportNumber };
}
function decodeLine(value) {
    try {
        return decodeURIComponent(value);
    }
    catch {
        return "";
    }
}
async function openRates() {
    VIEW.ratesOpen = true;
    VIEW.ratesShopOpen = false;
    VIEW.ratesContractorOpen = false;
    VIEW.ratesShopQuery = VIEW.ratesShop;
    VIEW.ratesContractorQuery = VIEW.ratesContractor;
    VIEW.ratesMessage = "";
    VIEW.ratesMessageOk = false;
    if (webapp === "") {
        paint();
        return;
    }
    VIEW.loading = true;
    VIEW.loadKind = "logo";
    VIEW.loadMessage = "Wczytuję adresy sklepów…";
    paint();
    try {
        const response = await fetch(webAppUrl(webapp, { action: "listStoreAddresses" }));
        const read = readAddressList(await response.json());
        if (!read.ok) {
            VIEW.addresses = [];
            VIEW.ratesShop = "";
            VIEW.ratesShopQuery = "";
            VIEW.ratesMessage = rateSaveMessage("addresses");
        }
        else {
            VIEW.addresses = read.addresses;
            const current = read.addresses.find((item) => item.address === VIEW.ratesShop);
            if (!current) {
                VIEW.ratesShop = "";
                VIEW.ratesShopQuery = "";
            }
            else {
                VIEW.ratesShopQuery = storeAddressLabel(current);
            }
        }
        if (VIEW.contractors.length === 0) {
            const listed = await fetch(webAppUrl(webapp, { action: "listContractors" }));
            const body = (await listed.json());
            if (body.ok && Array.isArray(body.data)) {
                VIEW.contractors = body.data;
            }
        }
        if (!rateContractorNames(VIEW.contractors).includes(VIEW.ratesContractor)) {
            VIEW.ratesContractor = "";
            VIEW.ratesContractorQuery = "";
        }
    }
    catch {
        VIEW.addresses = [];
        VIEW.ratesShop = "";
        VIEW.ratesShopQuery = "";
        VIEW.ratesMessage = rateSaveMessage("addresses");
    }
    finally {
        VIEW.loading = false;
        paint();
    }
}
async function saveRates() {
    commitRateFields();
    const common = {
        shop: VIEW.ratesShop,
        contractor: VIEW.ratesContractor,
        pickup: VIEW.ratesPickup,
        bag: VIEW.ratesBag,
        from: VIEW.ratesFrom,
    };
    const built = VIEW.ratesTarget === "harmonogram"
        ? saveRateHarmonogramBody({ ...common, days: VIEW.ratesDays })
        : saveRateBody(common);
    if (!built.ok) {
        VIEW.ratesMessage = rateSaveMessage(built.error);
        VIEW.ratesMessageOk = false;
        paint();
        return;
    }
    if (webapp === "") {
        VIEW.ratesMessage = "Brak adresu Web App.";
        VIEW.ratesMessageOk = false;
        paint();
        return;
    }
    VIEW.loading = true;
    VIEW.loadKind = "logo";
    VIEW.loadMessage = VIEW.ratesTarget === "harmonogram" ? "Zapisuję stawkę harmonogramu…" : "Zapisuję stawkę…";
    paint();
    try {
        const result = await postSheet(built.body);
        if (result.ok !== true) {
            VIEW.ratesMessage = rateSaveMessage(result.error);
            VIEW.ratesMessageOk = false;
            return;
        }
        VIEW.ratesPickup = "";
        VIEW.ratesBag = "";
        VIEW.ratesFrom = "";
        VIEW.ratesDays = "";
        VIEW.ratesMessage =
            VIEW.ratesTarget === "harmonogram" ? "Zapisano stawkę harmonogramu." : "Zapisano stawkę.";
        VIEW.ratesMessageOk = true;
        if (VIEW.screen === "statement" && VIEW.mode === "report") {
            const refreshed = await reloadStatement();
            if (!refreshed) {
                VIEW.status = STATEMENT_ERROR.refresh;
            }
        }
    }
    catch {
        VIEW.ratesMessage = rateSaveMessage("write");
        VIEW.ratesMessageOk = false;
    }
    finally {
        VIEW.loading = false;
        paint();
    }
}
async function postSheet(body) {
    const response = await fetch(webapp, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(body),
    });
    return (await response.json());
}
async function writeNow(message, body, apply) {
    if (webapp === "") {
        VIEW.status = "Brak adresu Web App.";
        paint();
        return;
    }
    VIEW.loading = true;
    VIEW.loadKind = "logo";
    VIEW.loadMessage = message;
    paint();
    try {
        const result = await postSheet(body);
        if (result.ok !== true) {
            VIEW.status = writeError(result.error);
            return;
        }
        await apply();
    }
    catch {
        VIEW.status = STATEMENT_ERROR.write;
    }
    finally {
        VIEW.loading = false;
        VIEW.loadKind = "logo";
        paint();
    }
}
async function reloadStatement() {
    if (!VIEW.applied || webapp === "") {
        return false;
    }
    const response = await fetch(webAppUrl(webapp, searchParams(VIEW.applied)));
    const read = readSettlement(await response.json());
    if (!read.ok) {
        return false;
    }
    VIEW.statement = adoptRows(VIEW.statement, read.rows, read.rates);
    return true;
}
async function commitEdit(el) {
    const ref = sheetRef(el);
    if (!ref) {
        return;
    }
    const row = findRow(VIEW.statement.rows, ref.sheetRow, ref.transportNumber);
    if (!row) {
        return;
    }
    const edit = el.dataset.edit;
    if (edit === "bags") {
        const built = bagsBody(row, el.value);
        if (!built.ok) {
            VIEW.status = built.error;
            paint();
            return;
        }
        await writeNow("Zapisuję liczbę worków…", built.body, () => {
            VIEW.statement = commitBags(VIEW.statement, ref.sheetRow, ref.transportNumber, built.bagCount);
            VIEW.status = "";
        });
        return;
    }
    if (edit === "route-rate") {
        const routeName = el.dataset.route ?? row.routeName;
        const built = routeRateBody(row, routeName, el.value);
        if (!built.ok) {
            VIEW.status = built.error;
            paint();
            return;
        }
        await writeNow("Zapisuję stawkę trasy…", built.body, () => {
            VIEW.statement = commitRouteRate(VIEW.statement, routeName, built.grosze);
            VIEW.status = "";
        });
        return;
    }
    const parsed = parseAmountText(el.value);
    if (parsed.kind === "bad") {
        VIEW.status = STATEMENT_ERROR.badRate;
        paint();
        return;
    }
    const amount = parsed.kind === "empty" ? null : parsed.value;
    if (edit === "bag-rate-route") {
        const routeName = el.dataset.route ?? "";
        if (routeName === "") {
            return;
        }
        VIEW.statement = setRouteBagRate(VIEW.statement, routeName, amount);
    }
    else if (edit === "bag-rate") {
        VIEW.statement = setBagRate(VIEW.statement, ref.sheetRow, ref.transportNumber, amount);
    }
    else if (edit === "pickup") {
        VIEW.statement = setPickup(VIEW.statement, ref.sheetRow, ref.transportNumber, amount);
    }
    VIEW.status = "";
    paint();
}
async function runApprove() {
    const statement = currentStatement(VIEW.statement);
    const built = buildApprove(VIEW.statement.invoice, statement, VIEW.statement.selected);
    if (!built.ok) {
        VIEW.status = STATEMENT_ERROR[built.error];
        paint();
        return;
    }
    const kind = approveShow(statementSums(VIEW.statement).selected);
    const started = Date.now();
    VIEW.loading = true;
    VIEW.loadKind = kind;
    VIEW.loadMessage = "Zatwierdzam rozliczenie…";
    VIEW.status = "";
    paint();
    try {
        const result = await postSheet(built.body);
        if (result.ok !== true) {
            VIEW.status = writeError(result.error);
        }
        else if (skippedCount(result) > 0) {
            const refreshed = await reloadStatement();
            if (!refreshed) {
                VIEW.status = STATEMENT_ERROR.refresh;
            }
            else {
                VIEW.status = STATEMENT_ERROR.partial;
            }
        }
        else {
            VIEW.status = "";
            VIEW.screen = screenAfterApprove();
            VIEW.ratesOpen = false;
        }
    }
    catch {
        VIEW.status = STATEMENT_ERROR.write;
    }
    finally {
        if (kind === "unicorn") {
            const left = UNICORN_HOLD_MS - (Date.now() - started);
            if (left > 0) {
                await new Promise((resolve) => {
                    setTimeout(resolve, left);
                });
            }
        }
        VIEW.loading = false;
        VIEW.loadKind = "logo";
        paint();
    }
}
function openStats() {
    const today = todayCalendar();
    const storage = typeof localStorage !== "undefined" ? localStorage : null;
    VIEW.stats = {
        ...emptyStats(today),
        contractors: VIEW.contractors,
        contractor: VIEW.contractor,
        sectionsCollapsed: loadSectionsCollapsed(storage, STATS_SECTION_IDS),
    };
    VIEW.screen = screenAfterOpenStats();
    VIEW.ratesOpen = false;
    VIEW.status = "";
    paint();
    void runStats();
}
function applyStatsField(field, value) {
    if (field === "month") {
        VIEW.stats = { ...VIEW.stats, month: value };
    }
    else if (field === "quarter") {
        VIEW.stats = { ...VIEW.stats, quarter: value };
    }
    else if (field === "from") {
        VIEW.stats = { ...VIEW.stats, from: value };
    }
    else if (field === "to") {
        VIEW.stats = { ...VIEW.stats, to: value };
    }
    else if (field === "contractor") {
        VIEW.stats = { ...VIEW.stats, contractor: value };
    }
    else {
        return;
    }
    paint();
}
function toggleStatsSection(id) {
    if (id === "") {
        return;
    }
    const collapsed = !(VIEW.stats.sectionsCollapsed[id] === true);
    VIEW.stats = {
        ...VIEW.stats,
        sectionsCollapsed: { ...VIEW.stats.sectionsCollapsed, [id]: collapsed },
    };
    writeStatsFold(typeof localStorage !== "undefined" ? localStorage : null, `section.${id}`, collapsed ? "closed" : "open");
    paint();
}
function toggleStatsTable(id) {
    if (id === "") {
        return;
    }
    const currently = VIEW.stats.tablesCollapsed[id] ?? true;
    const collapsed = !currently;
    VIEW.stats = {
        ...VIEW.stats,
        tablesCollapsed: { ...VIEW.stats.tablesCollapsed, [id]: collapsed },
    };
    writeStatsFold(typeof localStorage !== "undefined" ? localStorage : null, `table.${id}`, collapsed ? "closed" : "open");
    paint();
}
function shiftStatsPage(pager, dir) {
    if (pager === "empty-bags") {
        const next = VIEW.stats.emptyBagsPage + (dir === "next" ? 1 : -1);
        VIEW.stats = { ...VIEW.stats, emptyBagsPage: Math.max(1, next) };
        paint();
        return;
    }
    if (pager === "gaps") {
        const next = VIEW.stats.gapsPage + (dir === "next" ? 1 : -1);
        VIEW.stats = { ...VIEW.stats, gapsPage: Math.max(1, next) };
        paint();
        return;
    }
}
async function runStats() {
    if (webapp === "") {
        VIEW.stats = { ...VIEW.stats, status: "Brak adresu Web App. Dopisz ?webapp= do adresu tej strony." };
        paint();
        return;
    }
    const today = todayCalendar();
    const range = resolveStatsPeriod(VIEW.stats.period, today, {
        month: VIEW.stats.month,
        quarter: VIEW.stats.quarter,
        from: VIEW.stats.from,
        to: VIEW.stats.to,
    });
    if (!range) {
        const status = VIEW.stats.period === "exact"
            ? "Podaj poprawny zakres od–do (data początkowa nie później niż końcowa)."
            : VIEW.stats.period === "prevQuarter"
                ? "Wybierz kwartał z listy."
                : "Wybierz miesiąc z listy.";
        VIEW.stats = { ...VIEW.stats, status };
        paint();
        return;
    }
    VIEW.loading = true;
    VIEW.loadKind = "logo";
    VIEW.loadMessage = "Ładuję dane…";
    VIEW.stats = { ...VIEW.stats, status: "" };
    paint();
    try {
        const response = await fetch(webAppUrl(webapp, statsParams({
            dataOd: range.from,
            dataDo: range.to,
            podwykonawca: VIEW.stats.contractor,
        })));
        const body = await response.json();
        const parsed = readSettlementStats(body);
        if (!parsed.ok) {
            VIEW.stats = { ...VIEW.stats, status: parsed.error, report: null };
            return;
        }
        const report = buildStatsReport(parsed.rows, parsed.rates, {
            range,
            contractor: VIEW.stats.contractor || undefined,
            asOf: today,
        });
        const storage = typeof localStorage !== "undefined" ? localStorage : null;
        const stacked = {
            bags: chartShouldStack(report.bagsOverTime),
            costs: chartShouldStack(report.costsOverTime),
        };
        VIEW.stats = {
            ...VIEW.stats,
            today,
            appliedFrom: range.from,
            appliedTo: range.to,
            appliedKind: VIEW.stats.period,
            appliedMonth: VIEW.stats.month,
            appliedQuarter: VIEW.stats.quarter,
            appliedContractor: VIEW.stats.contractor,
            report,
            status: "",
            emptyBagsPage: 1,
            gapsPage: 1,
            tablesCollapsed: loadTablesCollapsed(storage, ["bags", "costs"], stacked),
        };
    }
    catch {
        VIEW.stats = { ...VIEW.stats, status: "Odczyt statystyk nie doszedł.", report: null };
    }
    finally {
        VIEW.loading = false;
        paint();
    }
}
boot();

})();
